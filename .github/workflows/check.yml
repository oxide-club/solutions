name: Verificar referências
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: solutions
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar revisão dos testes públicos
        id: tests
        working-directory: solutions
        run: python3 tools/check_lock.py --github-output "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.tests.outputs.repository }}
          ref: ${{ steps.tests.outputs.revision }}
          path: challenges
          persist-credentials: false
      - name: Compilar e executar os mesmos testes públicos
        working-directory: solutions
        run: make check
