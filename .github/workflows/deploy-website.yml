name: Publish website content
on:
  push:
    branches: [main]
    paths:
      - '*/community.yaml'
      - 'community.schema.json'
permissions: {}
jobs:
  deploy-website:
    if: github.repository == 'oxide-club/solutions'
    runs-on: ubuntu-latest
    steps:
      - name: Start website validation and production deployment
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Configure WEBSITE_DEPLOY_TOKEN with Actions: write access to oxide-club/oxideclub.dev."
            exit 1
          fi
          gh api --method POST \
            repos/oxide-club/oxideclub.dev/actions/workflows/deploy.yml/dispatches \
            -f ref=main
